<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>daysofam picks</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf7f2;
      --warm-white: #fff9f4;
      --sand: #e8dfd3;
      --terracotta: #c4896a;
      --terracotta-light: #e8b49a;
      --brown-dark: #3d2b1f;
      --brown-mid: #7a5c4a;
      --sage-light: #c2d0bb;
      --text-main: #2e1f14;
      --text-muted: #9a8070;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text-main);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 60px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 52px 0 36px;
      animation: fadeUp 0.7s ease both;
    }

    .logo-dot {
      width: 10px; height: 10px;
      background: var(--terracotta);
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 16px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--brown-dark);
    }

    header h1 span {
      font-style: italic;
      color: var(--terracotta);
    }

    header p {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 40px; height: 1px;
      background: var(--sand);
      margin: 20px auto 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 32px 0 24px;
      overflow-x: auto;
      padding-bottom: 4px;
      animation: fadeUp 0.7s 0.1s ease both;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--sand);
      background: transparent;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
    }

    .tab:hover {
      border-color: var(--terracotta-light);
      color: var(--terracotta);
    }

    .tab.active {
      background: var(--brown-dark);
      border-color: var(--brown-dark);
      color: var(--warm-white);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      animation: fadeUp 0.7s 0.2s ease both;
    }

    @media (max-width: 480px) {
      .grid { gap: 10px; }
    }

    .card {
      background: var(--warm-white);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--sand);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(61, 43, 31, 0.1);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--sand) 0%, var(--sage-light) 100%);
      overflow: hidden;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 12px 14px 14px;
    }

    .card-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--terracotta);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--brown-dark);
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .card-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-link {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--sand);
      color: var(--brown-mid);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .card-link:hover {
      background: var(--brown-dark);
      color: var(--warm-white);
      border-color: var(--brown-dark);
    }

    .state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--sand);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--sand);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--terracotta);
      text-decoration: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-dot"></div>
    <h1>daysofam <span>picks</span></h1>
    <p>produk favorit kami untuk hunian sewa yang cozy ✦</p>
    <div class="divider"></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">Semua</button>
    <button class="tab" data-cat="kebutuhan-rumah">Kebutuhan Rumah</button>
    <button class="tab" data-cat="home-decor">Home Decor</button>
    <button class="tab" data-cat="gardening">Gardening</button>
  </div>

  <div id="grid-wrap">
    <div class="state">
      <div class="spinner"></div>
      Memuat produk...
    </div>
  </div>

  <footer>
    <p>by <a href="https://instagram.com/daysofam" target="_blank" rel="noopener">@daysofam</a> · updated regularly</p>
  </footer>

</div>

<script>
  // ============================================================
  // GANTI URL INI dengan CSV URL dari Google Sheets kamu
  // File > Share > Publish to web > CSV > copy URL
  // ============================================================
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcUnmN-FhqMyi5IKO9Fux9R58k9jFFjJmK6tgnVFc9Drb7XKoXf8x_l-pziuWtni-Xks_QROZ23HE8/pub?gid=0&single=true&output=csv";

  const catLabels = {
    "kebutuhan-rumah": "Kebutuhan Rumah",
    "home-decor":      "Home Decor",
    "gardening":       "Gardening",
  };

  let products = [];
  let activeTab = "all";

  // CSV parser — handles quoted fields with commas inside
  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
      cols.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = (cols[i] || "").replace(/^"|"$/g, ""));
      return obj;
    }).filter(r => r.name);
  }

  function render() {
    const wrap = document.getElementById("grid-wrap");

    const filtered = activeTab === "all"
      ? products
      : products.filter(p =>
          p.categories.split(",").map(c => c.trim()).includes(activeTab)
        );

    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="state">Belum ada produk di kategori ini 🌿</div>`;
      return;
    }

    const cards = filtered.map(p => {
      const catList = p.categories
        .split(",")
        .map(c => catLabels[c.trim()] || c.trim())
        .join(" · ");

      const imgHtml = p.image
        ? `<div class="card-img"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>`
        : `<div class="card-img"><span>${p.emoji || "🛍️"}</span></div>`;

      const linkShopee  = p.link_shopee ? `<a class="card-link" href="${p.link_shopee}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Shopee</a>` : "";
      const linkTiktok  = p.link_tiktok ? `<a class="card-link" href="${p.link_tiktok}" target="_blank" rel="noopener" onclick="event.stopPropagation()">TikTok Shop</a>` : "";

      const primaryLink = p.link_shopee || p.link_tiktok || "#";

      return `
        <a class="card" href="${primaryLink}" target="_blank" rel="noopener">
          ${imgHtml}
          <div class="card-body">
            <div class="card-tag">${catList}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-links">${linkShopee}${linkTiktok}</div>
          </div>
        </a>`;
    }).join("");

    wrap.innerHTML = `<div class="grid">${cards}</div>`;
  }

  async function load() {
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      products = parseCSV(text);
      render();
    } catch (e) {
      document.getElementById("grid-wrap").innerHTML =
        `<div class="state">Gagal memuat produk. Pastikan Sheet sudah dipublish sebagai CSV. 🌿</div>`;
      console.error(e);
    }
  }

  document.getElementById("tabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.cat;
    render();
  });

  load();
</script>
</body>
</html>
