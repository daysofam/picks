<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>daysofam picks</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23c4896a'/%3E%3C/svg%3E" />
  <style>
    :root {
      --cream: #faf7f2;
      --warm-white: #fff9f4;
      --sand: #e8dfd3;
      --terracotta: #c4896a;
      --terracotta-light: #e8b49a;
      --brown-dark: #3d2b1f;
      --brown-mid: #7a5c4a;
      --sage-light: #c2d0bb;
      --text-main: #2e1f14;
      --text-muted: #9a8070;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text-main);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 60px;
      position: relative;
      z-index: 1;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 52px 0 36px;
      animation: fadeUp 0.7s ease both;
    }

    .logo-dot {
      width: 10px; height: 10px;
      background: var(--terracotta);
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 16px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: -0.5px;
      color: var(--brown-dark);
    }

    header h1 span {
      font-style: italic;
      color: var(--terracotta);
    }

    header p {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 40px; height: 1px;
      background: var(--sand);
      margin: 20px auto 16px;
    }

    /* SOCIAL BUTTONS */
    .social {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--sand);
      background: transparent;
      color: var(--brown-mid);
      font-size: 0.75rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      border-color: var(--terracotta-light);
      color: var(--terracotta);
    }

    .social-btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* SEARCH */
    .search-wrap {
      margin: 28px 0 0;
      animation: fadeUp 0.7s 0.05s ease both;
    }

    .search-wrap input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--sand);
      background: var(--warm-white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap input:focus { border-color: var(--terracotta-light); }

    /* TABS — wrapped */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 24px;
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .tab {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--sand);
      background: transparent;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: 'DM Sans', sans-serif;
    }

    .tab:hover { border-color: var(--terracotta-light); color: var(--terracotta); }
    .tab.active { background: var(--brown-dark); border-color: var(--brown-dark); color: var(--warm-white); }

    /* CARD LIST */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeUp 0.7s 0.2s ease both;
    }

    .card {
      background: var(--warm-white);
      border-radius: 16px;
      border: 1px solid var(--sand);
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
      height: 110px;
    }

    .card-img {
      flex-shrink: 0;
      width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: linear-gradient(135deg, var(--sand) 0%, var(--sage-light) 100%);
      overflow: hidden;
    }

    .card-img img { width: 100%; height: 100%; object-fit: cover; }

    .card-body {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }

    .card-tag {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--terracotta);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--brown-dark);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .card-link {
      font-size: 0.68rem;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--sand);
      color: var(--brown-mid);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .card-link:hover {
      background: var(--brown-dark);
      color: var(--warm-white);
      border-color: var(--brown-dark);
    }

    .card-link svg {
      width: 11px;
      height: 11px;
      flex-shrink: 0;
    }

    /* STATE */
    .state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--sand);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--sand);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    footer a { color: var(--terracotta); text-decoration: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-dot"></div>
    <h1>daysofam <span>picks</span></h1>
    <p>produk favorit kami untuk hunian sewa yang cozy ✦</p>
    <div class="divider"></div>
    <div class="social">
      <a class="social-btn" href="https://instagram.com/daysofam" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
        @daysofam
      </a>
      <a class="social-btn" href="https://tiktok.com/@daysofam" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>
        </svg>
        @daysofam
      </a>
    </div>
  </header>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Cari produk..." />
  </div>

  <div class="tabs" id="tabs">
    <!-- diisi dinamis dari JS -->
  </div>

  <div id="grid-wrap">
    <div class="state">
      <div class="spinner"></div>
      Memuat produk...
    </div>
  </div>

  <footer>
    <p>by <a href="https://instagram.com/daysofam" target="_blank" rel="noopener">@daysofam</a> · updated regularly</p>
  </footer>

</div>

<script>
  const CSV_PRODUK    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcUnmN-FhqMyi5IKO9Fux9R58k9jFFjJmK6tgnVFc9Drb7XKoXf8x_l-pziuWtni-Xks_QROZ23HE8/pub?gid=0&single=true&output=csv";
  const CSV_KATEGORI  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcUnmN-FhqMyi5IKO9Fux9R58k9jFFjJmK6tgnVFc9Drb7XKoXf8x_l-pziuWtni-Xks_QROZ23HE8/pub?gid=1273611560&single=true&output=csv";

  const ICON_SHOPEE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 8.75H2.2a.45.45 0 0 0-.45.49l1.17 11.67A1.8 1.8 0 0 0 4.7 22.5h14.6a1.8 1.8 0 0 0 1.78-1.59l1.17-11.67a.45.45 0 0 0-.45-.49zM8.55 5.4a3.45 3.45 0 0 1 6.9 0v.6H8.55V5.4zm-2.1.6V5.4a5.55 5.55 0 0 1 11.1 0V6h1.95v-.6a7.5 7.5 0 1 0-15 0V6h1.95zm5.55 9.75a2.85 2.85 0 1 1 2.85-2.85 2.85 2.85 0 0 1-2.85 2.85z"/></svg>`;
  const ICON_TIKTOK = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/></svg>`;

  let products   = [];
  let categories = []; // [{ key, label }]
  let activeTab  = "all";
  let searchQuery = "";

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = "", inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ""; }
        else { cur += ch; }
      }
      cols.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = (cols[i] || "").replace(/^"|"$/g, ""));
      return obj;
    }).filter(r => r[headers[0]]); // filter baris kosong
  }

  function buildTabs() {
    const tabsEl = document.getElementById("tabs");
    // Tab "Semua" selalu pertama
    const allBtn = `<button class="tab active" data-cat="all">Semua</button>`;
    const catBtns = categories.map(c =>
      `<button class="tab" data-cat="${c.key}">${c.label}</button>`
    ).join("");
    tabsEl.innerHTML = allBtn + catBtns;
  }

  function getCatLabel(key) {
    const found = categories.find(c => c.key === key.trim());
    return found ? found.label : key.trim();
  }

  function render() {
    const wrap = document.getElementById("grid-wrap");

    let filtered = activeTab === "all"
      ? products
      : products.filter(p =>
          p.categories.split(",").map(c => c.trim()).includes(activeTab)
        );

    if (searchQuery) {
      filtered = filtered.filter(p =>
        p.name.toLowerCase().includes(searchQuery.toLowerCase())
      );
    }

    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="state">Tidak ada produk yang ditemukan 🌿</div>`;
      return;
    }

    const cards = filtered.map(p => {
      const catList = p.categories
        .split(",")
        .map(c => getCatLabel(c))
        .join(" · ");

      const imgHtml = p.image
        ? `<div class="card-img"><img src="${p.image}" alt="${p.name}" loading="lazy"></div>`
        : `<div class="card-img"><span>${p.emoji || "🛍️"}</span></div>`;

      const linkShopee = p.link_shopee
        ? `<a class="card-link" href="${p.link_shopee}" target="_blank" rel="noopener">${ICON_SHOPEE} Shopee</a>`
        : "";
      const linkTiktok = p.link_tiktok
        ? `<a class="card-link" href="${p.link_tiktok}" target="_blank" rel="noopener">${ICON_TIKTOK} TikTok Shop</a>`
        : "";

      return `
        <div class="card">
          ${imgHtml}
          <div class="card-body">
            <div class="card-tag">${catList}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-links">${linkShopee}${linkTiktok}</div>
          </div>
        </div>`;
    }).join("");

    wrap.innerHTML = `<div class="card-list">${cards}</div>`;
  }

  async function load() {
    try {
      const [resProduk, resKategori] = await Promise.all([
        fetch(CSV_PRODUK),
        fetch(CSV_KATEGORI),
      ]);

      if (!resProduk.ok || !resKategori.ok) throw new Error("Fetch failed");

      const [textProduk, textKategori] = await Promise.all([
        resProduk.text(),
        resKategori.text(),
      ]);

      // Parse kategori — sort by order column
      const rawKat = parseCSV(textKategori);
      categories = rawKat
        .sort((a, b) => Number(a.order) - Number(b.order))
        .map(r => ({ key: r.key, label: r.label }));

      products = parseCSV(textProduk);

      buildTabs();
      render();
    } catch (e) {
      document.getElementById("grid-wrap").innerHTML =
        `<div class="state">Gagal memuat produk. Pastikan Sheet sudah dipublish sebagai CSV. 🌿</div>`;
      console.error(e);
    }
  }

  document.getElementById("tabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.cat;
    render();
  });

  document.getElementById("search").addEventListener("input", e => {
    searchQuery = e.target.value;
    render();
  });

  load();
</script>
</body>
</html>
